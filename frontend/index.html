<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ponte Social</title>
    <script>
      // Tema antes de a página aparecer: a escolha salva ou, sem ela, o escuro
      (function () {
        var t = null;
        try { t = localStorage.getItem('ponte_tema'); } catch (e) {}
        if (t !== 'claro' && t !== 'escuro') {
          t = 'escuro'; // padrão do painel de turno; a pessoa pode trocar no botão de tema
        }
        document.documentElement.dataset.tema = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
